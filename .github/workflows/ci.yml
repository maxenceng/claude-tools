name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — the older result is no longer interesting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The plugin is what people install, and a malformed manifest fails at install time in
  # someone else's session with an error that does not name the file. Cheapest job, so it
  # runs first and fails fast.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate manifests, frontmatter and cross-references
        run: |
          pip install --quiet pyyaml
          ./scripts/verify-plugin.sh

  # The template is the readable, buildable source. If it does not build, nothing
  # downstream can.
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/spring-ddd
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version-file: templates/spring-ddd/frontend/.nvmrc
          cache: npm
          cache-dependency-path: templates/spring-ddd/frontend/package-lock.json

      - name: Backend — lint, tests, duplication
        run: make ci

      # The template ships check-openapi.sh and a CI step that calls it, but that
      # workflow only ever runs inside a generated project. Exercise it here too, or the
      # script can rot and we find out from someone else's build.
      - name: OpenAPI schema is current
        run: make openapi-check

      - name: Frontend — typecheck and tests
        run: |
          make -C frontend install
          make fe-check

  # The check that actually matters: a project generated from the archetype has to
  # build. The template building says nothing about whether the descriptor still copies
  # every file, filters the right ones, or restores the executable bit — and those break
  # silently, surfacing only when someone starts a new project.
  archetype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version-file: templates/spring-ddd/frontend/.nvmrc

      # Generates the archetype, installs it, generates a project, asserts the things the
      # archetype format cannot express, then builds both halves. Identical to what runs
      # locally, so a green run here means the same script passed there.
      - name: Generate a project and build it
        run: ./scripts/verify-archetype.sh
