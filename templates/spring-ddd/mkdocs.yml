# No plugin, only settings Zensical reads or skips harmlessly, so MkDocs 1.x stays a fallback (ADR 0019).
# `validation` is for MkDocs alone: Zensical checks links and anchors by default.
site_name: app
docs_dir: docs
site_dir: site
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Dark first. `name` and `material/` icons, because MkDocs needs a theme name and Material lacks Lucide (ADR 0021).
theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
