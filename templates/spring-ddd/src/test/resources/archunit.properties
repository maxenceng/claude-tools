# The template ships with no bounded context, so rules like "@Service classes are named
# *ApplicationService" match nothing. ArchUnit treats a rule that checked zero classes as
# a failure, on the reasonable assumption that it has silently stopped applying.
#
# DELETE THIS FILE once the first context exists. The default is the more useful
# behaviour: if a rule suddenly matches nothing, something was renamed out from under it
# and you want to be told.
archRule.failOnEmptyShould=false
