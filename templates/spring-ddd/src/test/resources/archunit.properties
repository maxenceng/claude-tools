# `training` (ADR 0008) is a worked example with no @Service, @Repository or controller of
# its own, so rules like "@Service classes are named *ApplicationService" still match
# nothing. ArchUnit treats a rule that checked zero classes as a failure, on the reasonable
# assumption that it has silently stopped applying.
#
# DELETE THIS FILE once your own context uses all three — `training` alone doesn't retire
# it. The default is the more useful behaviour: if a rule suddenly matches nothing,
# something was renamed out from under it and you want to be told.
archRule.failOnEmptyShould=false
