spring.application.name=app

# The worked-example vendor (ADR 0008/0009 in docs/adr) — a URL and key that resolve on their
# own so a fresh clone builds and tests without either set.
training.catalogue.url=https://example-training-catalogue.invalid/api/courses
training.catalogue.api-key=${TRAINING_CATALOGUE_API_KEY:development-only-not-for-any-deployment}

# The schema is committed, so its output has to be stable: unsorted, an unrelated change
# reorders paths and produces a diff that hides the real one.
springdoc.writer-with-order-by-keys=true
springdoc.api-docs.path=/v3/api-docs

# Swagger UI is a convenience for humans and is not what the client is generated from —
# that is the raw schema above.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
