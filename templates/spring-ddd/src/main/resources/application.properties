spring.application.name=app

# The OpenAPI schema is captured to docs/openapi.json and committed, so its output has
# to be stable: without sorting, an unrelated change can reorder paths and schemas and
# produce a diff that hides the real one. The API description itself lives in
# OpenApiConfiguration.
springdoc.writer-with-order-by-keys=true
springdoc.api-docs.path=/v3/api-docs

# Swagger UI is a convenience for humans and is not what the client is generated from —
# that is the raw schema above.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
